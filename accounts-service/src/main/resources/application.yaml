spring:
  application:
    name: accounts-service
  datasource:
    url: jdbc:postgresql://${DB_HOST}:{DB_PORT}/${DB_NAME}
    username: ${ACCOUNTS_DATASOURCE_USERNAME}
    password: ${ACCOUNTS_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always