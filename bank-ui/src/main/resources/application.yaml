spring:
  application:
    name: bank-ui
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: bank-ui
            client-secret: ui-client-secret
            authorization-grant-type: authorization_code
            scope: openid, profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            provider: keycloak
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/bank-realm
  zookeeper:
    connect-string: localhost:2181
    discovery:
      enabled: true
      register: false
server:
  port: 8081

bank:
  gateway:
    base-url: http://bank-gateway