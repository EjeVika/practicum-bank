server:
  port: ${NOTIFICATIONS_SERVICE_PORT:8087}

spring:
  application:
    name: notifications-service

  config:
    import: configserver:http://${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:8888}

  cloud:
    zookeeper:
      connect-string: ${ZOOKEEPER_HOST:localhost}:${ZOOKEEPER_PORT:2181}
      discovery:
        enabled: true