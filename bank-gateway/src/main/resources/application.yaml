server:
  port: 8082
spring:
  application:
    name: bank-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # Адрес issuer (Keycloak realm). Gateway по нему получает ключи
          # и параметры токена, чтобы валидировать JWT от UI
          issuer-uri: http://localhost:8080/realms/bank-realm
  cloud:
    config:
      enabled: false
    gateway:
      server:
        webflux:
          routes:
            # 1. Запросы от bank-ui к accounts-service
            - id: accounts-service-ui
              uri: lb://accounts-service
              predicates:
                - Path=/api/v1/accounts/**
              filters:
                - name: JwtTokenRelay
                - StripPrefix=2

            # 2. Запросы от bank-ui к cash-service
            - id: cash-service-ui
              uri: lb://cash-service
              predicates:
                - Path=/api/v1/cash/**
              filters:
                - name: JwtTokenRelay
                - StripPrefix=2

            # 3. Внутренние запросы от любых сервисов к accounts-service
            - id: accounts-service-internal
              uri: lb://accounts-service
              predicates:
                - Path=/accounts/**
              filters:

            # 4. Запросы от bank-ui к transfer-service
            - id: transfer-service-ui
              uri: lb://transfer-service
              predicates:
                - Path=/api/v1/transfer/**
              filters:
                - name: JwtTokenRelay
                - StripPrefix=2
    zookeeper:
      connect-string: localhost:2181
      discovery:
        enabled: true
logging:
  level:
    root: INFO