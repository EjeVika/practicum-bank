server:
  port: ${TRANSFER_SERVICE_PORT:8086}

spring:
  application:
    name: transfer-service

  config:
    import: optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:8888}

  cloud:
    zookeeper:
      connect-string: ${ZOOKEEPER_HOST:localhost}:${ZOOKEEPER_PORT:2181}
      discovery:
        enabled: true