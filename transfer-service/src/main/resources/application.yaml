server:
  port: 8086
spring:
  application:
    name: transfer-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/bank-realm

      client:
        registration:
          transfer-service:
            provider: keycloak
            client-id: transfer-service
            client-secret: xGEaF7DKCOxsfn0Vzp3hKv4eQirDLYld
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/bank-realm
  cloud:
    config:
      enabled: false
    zookeeper:
      connect-string: localhost:2181
      discovery:
        enabled: true


management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

bank:
