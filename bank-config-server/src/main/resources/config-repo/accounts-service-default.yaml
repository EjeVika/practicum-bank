spring:
  datasource:
    url: jdbc:postgresql://${ACCOUNTS_DB_HOST:localhost}:${ACCOUNTS_DB_PORT:15432}/${ACCOUNTS_DB_NAME:accounts_db}
    username: ${ACCOUNTS_DB_USER:accounts}
    password: ${ACCOUNTS_DB_PASSWORD:accounts}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8080}/realms/${KEYCLOAK_REALM:bank-realm}

      client:
        registration:
          accounts-service:
            provider: keycloak
            client-id: accounts-service
            client-secret: ${ACCOUNTS_SERVICE_CLIENT_SECRET:accounts-service-secret-123}
            authorization-grant-type: client_credentials

        provider:
          keycloak:
            issuer-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8080}/realms/${KEYCLOAK_REALM:bank-realm}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

bank:
  gateway:
    base-url: http://${BANK_GATEWAY_HOST:localhost}:${BANK_GATEWAY_PORT:8082}

logging:
  level:
    org.flywaydb: DEBUG