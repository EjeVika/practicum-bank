spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: bank-ui
            client-secret: ${UI_CLIENT_SECRET:ui-client-secret}
            authorization-grant-type: authorization_code
            scope: openid, profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            provider: keycloak

        provider:
          keycloak:
            issuer-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8080}/realms/${KEYCLOAK_REALM:bank-realm}

bank:
  gateway:
    base-url: http://${BANK_GATEWAY_HOST:localhost}:${BANK_GATEWAY_PORT:8082}

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    org.springframework.security.oauth2: DEBUG
